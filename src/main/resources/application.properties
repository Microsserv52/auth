spring.application.name=auth
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
platform.account-url=${ACCOUNT_URL:http://account:8080}
platform.jwt-secret=${JWT_SECRET:change-me-in-development-use-a-long-random-secret}
platform.internal-service-secret=${INTERNAL_SERVICE_SECRET:change-me-in-development}
platform.access-token-expiration-seconds=${ACCESS_TOKEN_EXPIRATION_SECONDS:900}
